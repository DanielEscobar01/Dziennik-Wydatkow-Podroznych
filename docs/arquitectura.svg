<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura clara de la aplicación</title>
  <desc id="description">La compilación estática se publica en GitHub Pages. El navegador ejecuta index.html y main.js; main.js consulta Supabase Auth y la API automática de datos, que accede a PostgreSQL con RLS. Frankfurter y OpenStreetMap son servicios externos.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#46617f"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #20344d; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #52677e; }
      .lane-title { font-size: 17px; font-weight: 700; }
      .box-title { font-size: 16px; font-weight: 700; }
      .body { font-size: 13px; fill: #455d78; }
      .small { font-size: 12px; fill: #52677e; }
      .lane { fill: #f7faff; stroke: #8da7c3; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #5a7fad; stroke-width: 2; rx: 12; }
      .node-green { fill: #edf8f1; stroke: #4a9366; stroke-width: 2; rx: 12; }
      .node-orange { fill: #fff5e8; stroke: #c17a31; stroke-width: 2; rx: 12; }
      .node-purple { fill: #f4effa; stroke: #8969ad; stroke-width: 2; rx: 12; }
      .arrow { fill: none; stroke: #46617f; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-green { fill: none; stroke: #4a9366; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1380" fill="#ffffff"/>
  <text class="title" x="48" y="52">Cómo está conectada la aplicación</text>
  <text class="subtitle" x="48" y="80">Vista general — las páginas siguientes explican el arranque, las funciones y los flujos detallados.</text>

  <rect class="lane" x="48" y="108" width="1504" height="225" rx="18"/>
  <text class="lane-title" x="76" y="143">1 · Compilación y publicación estática</text>
  <rect class="node" x="80" y="178" width="290" height="105"/>
  <text class="box-title" x="225" y="212" text-anchor="middle">Código fuente</text>
  <text class="body" x="225" y="239" text-anchor="middle">HTML · JavaScript · CSS · recursos</text>
  <rect class="node" x="460" y="178" width="290" height="105"/>
  <text class="box-title" x="605" y="212" text-anchor="middle">GitHub Actions</text>
  <text class="body" x="605" y="239" text-anchor="middle">npm ci · npm run build</text>
  <rect class="node" x="840" y="178" width="290" height="105"/>
  <text class="box-title" x="985" y="212" text-anchor="middle">Vite</text>
  <text class="body" x="985" y="239" text-anchor="middle">Empaqueta archivos estáticos en dist/</text>
  <rect class="node" x="1220" y="178" width="290" height="105"/>
  <text class="box-title" x="1365" y="212" text-anchor="middle">GitHub Pages</text>
  <text class="body" x="1365" y="239" text-anchor="middle">Entrega archivos; no ejecuta el backend</text>
  <path class="arrow" d="M370 230 H450"/>
  <path class="arrow" d="M750 230 H830"/>
  <path class="arrow" d="M1130 230 H1210"/>

  <rect class="lane" x="48" y="365" width="910" height="620" rx="18"/>
  <text class="lane-title" x="76" y="402">2 · En el navegador — SPA (aplicación de una sola página)</text>
  <rect class="node" x="88" y="447" width="330" height="125"/>
  <text class="box-title" x="253" y="482" text-anchor="middle">index.html</text>
  <text class="body" x="253" y="510" text-anchor="middle">Pantallas, formularios y estilos</text>
  <text class="small" x="253" y="535" text-anchor="middle">Proporciona los elementos que actualiza JavaScript</text>
  <rect class="node" x="548" y="447" width="350" height="125"/>
  <text class="box-title" x="723" y="482" text-anchor="middle">src/main.js</text>
  <text class="body" x="723" y="510" text-anchor="middle">Estado · eventos · consultas · renderizado</text>
  <text class="small" x="723" y="535" text-anchor="middle">Coordina las funciones de la aplicación</text>
  <path class="arrow" d="M418 510 H538"/>
  <text class="small" x="478" y="496" text-anchor="middle">HTML / DOM</text>

  <rect class="node-purple" x="88" y="626" width="330" height="125"/>
  <text class="box-title" x="253" y="660" text-anchor="middle">Módulos de dominio</text>
  <text class="body" x="253" y="688" text-anchor="middle">stay-expenses.js · daily-location-ranges.js</text>
  <text class="small" x="253" y="713" text-anchor="middle">Promedios, días caros y rangos de ubicaciones</text>
  <rect class="node-purple" x="548" y="626" width="350" height="125"/>
  <text class="box-title" x="723" y="660" text-anchor="middle">Bibliotecas del navegador</text>
  <text class="body" x="723" y="688" text-anchor="middle">Chart.js · Leaflet · Turf</text>
  <text class="small" x="723" y="713" text-anchor="middle">Gráficos, mapas y rutas aéreas</text>
  <path class="arrow" d="M723 572 V616"/>
  <text class="small" x="738" y="600">usa</text>
  <path class="arrow" d="M548 555 H438 V688 H418"/>
  <text class="small" x="448" y="610">usa módulos</text>

  <rect class="node-green" x="88" y="806" width="330" height="125"/>
  <text class="box-title" x="253" y="840" text-anchor="middle">Recursos locales</text>
  <text class="body" x="253" y="868" text-anchor="middle">Banderas · logos · JSON de aeropuertos</text>
  <text class="small" x="253" y="893" text-anchor="middle">Incluidos en los archivos estáticos publicados</text>
  <rect class="node-green" x="548" y="806" width="350" height="125"/>
  <text class="box-title" x="723" y="840" text-anchor="middle">Almacenamiento / exportación local</text>
  <text class="body" x="723" y="868" text-anchor="middle">sessionStorage: vistas previas limitadas</text>
  <text class="small" x="723" y="893" text-anchor="middle">CSV se crea y descarga en el dispositivo</text>

  <rect class="lane" x="998" y="365" width="554" height="620" rx="18"/>
  <text class="lane-title" x="1026" y="402">3 · Servicios de Supabase</text>
  <rect class="node-green" x="1060" y="447" width="430" height="105"/>
  <text class="box-title" x="1275" y="480" text-anchor="middle">Supabase Auth</text>
  <text class="body" x="1275" y="508" text-anchor="middle">Inicio de sesión, sesión persistente y cierre de sesión</text>
  <rect class="node-green" x="1060" y="610" width="430" height="115"/>
  <text class="box-title" x="1275" y="645" text-anchor="middle">API REST de datos de Supabase</text>
  <text class="body" x="1275" y="673" text-anchor="middle">PostgREST automática · no es una API propia del proyecto</text>
  <text class="small" x="1275" y="698" text-anchor="middle">La usa @supabase/supabase-js al llamar supabase.from(...)</text>
  <rect class="node-green" x="1060" y="790" width="430" height="145"/>
  <text class="box-title" x="1275" y="825" text-anchor="middle">Base de datos Supabase: PostgreSQL</text>
  <text class="body" x="1275" y="853" text-anchor="middle">trips · trip_days · expenses · trip_reservations</text>
  <text class="body" x="1275" y="880" text-anchor="middle">Historial personal y ubicaciones diarias</text>
  <text class="small" x="1275" y="908" text-anchor="middle">RLS limita filas según la sesión y las reglas SQL</text>
  <path class="arrow-green" d="M1275 725 V780"/>
  <text class="small" x="1290" y="758">consultas / cambios</text>

  <path class="arrow-green" d="M898 488 H1040 V500 H1050"/>
  <text class="small" x="965" y="472">sesión</text>
  <path class="arrow-green" d="M898 535 H970 V667 H1050"/>
  <text class="small" x="911" y="588">leer / guardar</text>

  <path class="arrow" d="M1365 283 V343 H723 V437"/>
  <text class="small" x="1060" y="325">El navegador descarga y ejecuta la aplicación</text>

  <rect class="lane" x="48" y="1015" width="1504" height="145" rx="18"/>
  <text class="lane-title" x="76" y="1050">4 · Servicios externos usados por funciones del navegador</text>
  <rect class="node-orange" x="180" y="1070" width="520" height="68"/>
  <text class="box-title" x="440" y="1098" text-anchor="middle">Frankfurter API</text>
  <text class="small" x="440" y="1121" text-anchor="middle">src/main.js → fetchRate(): tasas de conversión a PLN</text>
  <rect class="node-orange" x="900" y="1070" width="520" height="68"/>
  <text class="box-title" x="1160" y="1098" text-anchor="middle">OpenStreetMap</text>
  <text class="small" x="1160" y="1121" text-anchor="middle">Leaflet en src/main.js descarga mosaicos para mapas</text>

  <rect class="lane" x="48" y="1180" width="1504" height="145" rx="18"/>
  <text class="lane-title" x="76" y="1215">5 · Función local del navegador (no es un servicio externo)</text>
  <rect class="node-purple" x="590" y="1235" width="420" height="68"/>
  <text class="box-title" x="800" y="1263" text-anchor="middle">Importación Excel · código local</text>
  <text class="small" x="800" y="1286" text-anchor="middle">Parser implementado; actualmente sin botón en la interfaz</text>
</svg>
